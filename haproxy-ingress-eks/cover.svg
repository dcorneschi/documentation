<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HAProxy Ingress Controller on EKS with a Network Load Balancer</title>
  <desc id="d">HAProxy Ingress Controller on EKS with a Network Load Balancer: chart defaults that fail on t3.small, and the values that fix them. Helm, kubernetes-ingress 1.57.1, NLB, NodePort, QUIC, ssl-redirect-port, EKS 1.35. Small drawings: a terminal showing the redirect Location https://echo.example.test:443/ after the fix, an NLB with TCP 80 and 443 forwarding to an HAProxy pod on 8080 and 8443, three fixes (256Mi memory, TCP only, redirect to 443), and icons for Helm, the load balancer, memory, ports, redirect and events.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #326ce5; }
      .ink { fill: #343a40; }
      .pap { fill: #ffffff; stroke: #ced4da; stroke-width: 6; }
      .al  { stroke: #326ce5; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wt  { fill: #ffffff; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .vf  { fill: #326ce5; }
      .vs  { stroke: #326ce5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .vl  { fill: #326ce5; fill-opacity: .18; }
      .vp  { fill: #ffffff; }
      .vn  { fill: #868e96; }
      .vterm { fill: #212529; }
      .vtbar { fill: #343a40; }
      .vtx { fill: #e9ecef; }
      .vtb { fill: #74c0fc; }
      .ok  { fill: #2b8a3e; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .ink { fill: #c9d1d9; }
        .pap { fill: #0d1117; stroke: #30363d; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .vp  { fill: #0d1117; }
        .vn  { fill: #8b949e; }
        .vterm { fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .vtbar { fill: #21262d; }
        .ok  { fill: #3fb950; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: the redirect after the fix (real output from the test) -->
  <g transform="translate(100,200)">
    <rect class="vterm" x="0" y="0" width="900" height="290" rx="22"/>
    <rect class="vtbar" x="0" y="0" width="900" height="56" rx="22"/>
    <rect class="vtbar" x="0" y="34" width="900" height="22"/>
    <circle cx="40" cy="28" r="11" fill="#ff5f57"/><circle cx="80" cy="28" r="11" fill="#febc2e"/><circle cx="120" cy="28" r="11" fill="#28c840"/>
    <g font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="29">
      <text class="vtx" x="32" y="126">$ curl -sI http://&lt;host&gt;/ | grep -i location</text>
      <text class="vtb" x="32" y="186">location: https://echo.example.test:443/</text>
    </g>
  </g>

  <!-- centre: NLB -> HAProxy -->
  <rect class="pap" x="1100" y="250" width="330" height="190" rx="24"/>
  <text class="ink" x="1265" y="325" text-anchor="middle" font-size="46" font-weight="700">NLB</text>
  <text class="n" x="1265" y="385" text-anchor="middle" font-size="32" font-family="Menlo, Consolas, 'Liberation Mono', monospace">TCP 80 · 443</text>
  <path class="al" d="M1460,345 H1600 M1570,319 L1600,345 L1570,371"/>
  <rect class="a" x="1630" y="230" width="340" height="230" rx="28"/>
  <text class="wt" x="1800" y="325" text-anchor="middle" font-size="48" font-weight="700">HAProxy</text>
  <text class="wt" x="1800" y="390" text-anchor="middle" font-size="34" font-weight="700" font-family="Menlo, Consolas, 'Liberation Mono', monospace">8080 · 8443</text>
  <text class="n" x="1265" y="510" text-anchor="middle" font-size="34">internet-facing</text>
  <text class="n" x="1800" y="530" text-anchor="middle" font-size="34">ingress pods</text>

  <!-- right: the three fixes -->
  <g font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="700">
    <rect class="pap" x="2040" y="220" width="600" height="80" rx="18"/>
    <text class="ok" x="2080" y="273">✓</text><text class="ink" x="2130" y="273">memory: 256Mi</text>
    <rect class="pap" x="2040" y="320" width="600" height="80" rx="18"/>
    <text class="ok" x="2080" y="373">✓</text><text class="ink" x="2130" y="373">quic: false</text>
    <rect class="pap" x="2040" y="420" width="600" height="80" rx="18"/>
    <text class="ok" x="2080" y="473">✓</text><text class="ink" x="2130" y="473">ssl-redirect-port: 443</text>
  </g>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="140">HAProxy Ingress on EKS with an NLB</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="80">Chart defaults that fail on t3.small, and the values that fix them</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="44">Helm · kubernetes-ingress 1.57.1 · NLB · NodePort · QUIC · ssl-redirect-port · EKS 1.35</text>

  <!-- icon row -->
  <!-- helm chart: package -->
  <g transform="translate(676,1290) scale(0.5)">
    <path class="vl" d="M100,24 L170,62 V140 L100,178 L30,140 V62 Z"/>
    <path class="vs" d="M100,24 L170,62 V140 L100,178 L30,140 V62 Z M30,62 L100,100 L170,62 M100,100 V178" stroke-width="10"/>
  </g>
  <text class="vn" x="726" y="1450" text-anchor="middle" font-size="34">Helm chart</text>
  <!-- load balancer: one in, three out -->
  <g transform="translate(936,1290) scale(0.5)">
    <circle class="vf" cx="40" cy="100" r="22"/>
    <path class="vs" d="M62,100 H100 M100,100 L160,40 M100,100 H160 M100,100 L160,160" stroke-width="12"/>
    <circle class="vl" cx="168" cy="40" r="16"/><circle class="vl" cx="168" cy="100" r="16"/><circle class="vl" cx="168" cy="160" r="16"/>
  </g>
  <text class="vn" x="986" y="1450" text-anchor="middle" font-size="34">NLB</text>
  <!-- memory chip -->
  <g transform="translate(1196,1290) scale(0.5)">
    <rect class="vp" x="40" y="40" width="120" height="120" rx="14" stroke="#326ce5" stroke-width="10"/>
    <rect class="vl" x="70" y="70" width="60" height="60" rx="6"/>
    <path class="vs" d="M70,40 V18 M100,40 V18 M130,40 V18 M70,160 V182 M100,160 V182 M130,160 V182 M40,70 H18 M40,130 H18 M160,70 H182 M160,130 H182" stroke-width="9"/>
  </g>
  <text class="vn" x="1246" y="1450" text-anchor="middle" font-size="34">memory</text>
  <!-- ports: plug -->
  <g transform="translate(1456,1290) scale(0.5)">
    <rect class="vl" x="50" y="70" width="100" height="70" rx="12"/>
    <rect class="vp" x="50" y="70" width="100" height="70" rx="12" fill="none" stroke="#326ce5" stroke-width="10"/>
    <path class="vs" d="M80,70 V30 M120,70 V30 M100,140 V180" stroke-width="12"/>
  </g>
  <text class="vn" x="1506" y="1450" text-anchor="middle" font-size="34">ports</text>
  <!-- redirect arrow -->
  <g transform="translate(1716,1290) scale(0.5)">
    <path class="vs" d="M40,150 V110 A50,50 0 0 1 90,60 H160 M130,30 L162,60 L130,90" stroke-width="16"/>
  </g>
  <text class="vn" x="1766" y="1450" text-anchor="middle" font-size="34">redirect</text>
  <!-- events: list -->
  <g transform="translate(1976,1290) scale(0.5)">
    <rect class="vp" x="30" y="24" width="140" height="160" rx="14" stroke="#326ce5" stroke-width="10"/>
    <circle class="vf" cx="62" cy="68" r="9"/><circle class="vf" cx="62" cy="104" r="9"/><circle class="vf" cx="62" cy="140" r="9"/>
    <path class="vs" d="M84,68 H146 M84,104 H146 M84,140 H130" stroke-width="10"/>
  </g>
  <text class="vn" x="2026" y="1450" text-anchor="middle" font-size="34">events</text>
</svg>
