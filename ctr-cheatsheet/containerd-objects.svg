<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 840 456" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">containerd's objects and who talks to them</title>
  <desc id="d">ctr connects to containerd's gRPC socket /run/containerd/containerd.sock; crictl and the kubelet go through containerd's CRI plugin. Inside containerd everything belongs to a namespace: default for ctr, k8s.io for Kubernetes. An image is a name, such as docker.io/library/nginx:latest, pointing at blobs in the content store: index, manifest, config and layers (ctr content list). Unpacking turns the layers into committed snapshots on the overlayfs snapshotter (ctr snapshots list). A container is only metadata: ID, image, runtime io.containerd.runc.v2, OCI spec and labels (ctr containers info), plus an active snapshot that becomes its writable root filesystem. A task is the running process: containerd starts a shim (containerd-shim-runc-v2), which runs runc; the root filesystem is mounted at /run/containerd/io.containerd.runtime.v2.task/namespace/ID/rootfs and the process gets a cgroup such as /default/limited-web. ctr run does container create plus task start in one step.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; white-space: pre; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10px; fill: #495057; white-space: pre; }
      .d   { font-size: 11px; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .zone{ fill: none; stroke: #ced4da; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="840" height="456" fill="#ffffff"/>
  <text class="h" x="20" y="28">containerd's objects and who talks to them</text>
  <text class="sub" x="20" y="48">containerd / ctr v2.3.4, runc 1.4.3, overlayfs snapshotter (kind node)</text>

  <!-- clients -->
  <rect class="n" x="20" y="70" width="150" height="56" rx="6"/>
  <text class="tb" x="32" y="92">ctr</text>
  <text class="d" x="32" y="110">containerd's own API</text>
  <rect class="n" x="20" y="140" width="150" height="56" rx="6"/>
  <text class="tb" x="32" y="162">crictl · kubelet</text>
  <text class="d" x="32" y="180">Kubernetes CRI API</text>
  <path class="lne" d="M172,98 L352,98"/>
  <text class="ms" x="222" y="114">no CRI: straight in</text>
  <path class="lne" d="M172,168 L206,168"/>
  <text class="ms" x="20" y="218">/run/containerd/</text>
  <text class="ms" x="20" y="232">  containerd.sock</text>

  <!-- containerd -->
  <rect class="zone" x="210" y="62" width="618" height="382" rx="8"/>
  <text class="lb" x="222" y="80">CONTAINERD</text>
  <rect class="n" x="222" y="140" width="110" height="56" rx="6"/>
  <text class="tb" x="232" y="162">CRI plugin</text>
  <text class="d" x="232" y="180">pods, sandboxes</text>
  <path class="lne" d="M334,168 L352,168"/>

  <rect class="zone" x="356" y="86" width="460" height="346" rx="8"/>
  <text class="lb" x="368" y="104">NAMESPACE: default (ctr) · k8s.io (Kubernetes)</text>

  <!-- image + content -->
  <rect class="w" x="368" y="114" width="206" height="78" rx="6"/>
  <text class="tb" x="380" y="134">image</text>
  <text class="m" x="380" y="152">docker.io/library/</text>
  <text class="m" x="380" y="166">  nginx:latest</text>
  <text class="d" x="380" y="184">a name → index digest</text>
  <rect class="w" x="598" y="114" width="206" height="78" rx="6"/>
  <text class="tb" x="610" y="134">content store</text>
  <text class="d" x="610" y="152">blobs by digest: index,</text>
  <text class="d" x="610" y="168">manifest, config, layers</text>
  <text class="ms" x="610" y="184">ctr content list</text>
  <path class="lne" d="M576,152 L594,152"/>

  <!-- snapshots -->
  <path class="lne" d="M700,194 L700,214"/>
  <text class="ms" x="706" y="208">unpack</text>
  <rect class="g" x="598" y="218" width="206" height="78" rx="6"/>
  <text class="tb" x="610" y="238">snapshots (overlayfs)</text>
  <text class="d" x="610" y="256">Committed: image layers</text>
  <text class="d" x="610" y="272">Active: a container's writable root</text>
  <text class="ms" x="610" y="288">ctr snapshots list</text>

  <!-- container -->
  <rect class="r" x="368" y="218" width="206" height="78" rx="6"/>
  <text class="tb" x="380" y="238">container (metadata only)</text>
  <text class="d" x="380" y="256">image, runtime, OCI spec, labels</text>
  <text class="m" x="380" y="272">io.containerd.runc.v2</text>
  <text class="ms" x="380" y="288">ctr containers create / info</text>
  <path class="lne" d="M470,194 L470,214"/>
  <path class="lne" d="M596,262 L578,262"/>

  <!-- task -->
  <path class="lne" d="M470,298 L470,318"/>
  <text class="ms" x="476" y="312">tasks start</text>
  <rect class="rw" x="368" y="322" width="436" height="98" rx="6"/>
  <text class="tb" x="380" y="342">task: the running process</text>
  <text class="d" x="380" y="360">containerd-shim-runc-v2 → runc → PID in its own cgroup (0::/default/limited-web)</text>
  <text class="ms" x="380" y="378">rootfs: /run/containerd/io.containerd.runtime.v2.task/</text>
  <text class="ms" x="380" y="392">          &lt;namespace&gt;/&lt;id&gt;/rootfs</text>
  <text class="ms" x="380" y="410">ctr tasks list / ps / exec / kill / delete · ctr run = create + start</text>
</svg>
