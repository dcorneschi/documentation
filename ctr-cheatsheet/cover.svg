<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ctr Cheatsheet (containerd CLI)</title>
  <desc id="d">ctr Cheatsheet (containerd CLI): images, containers, tasks, namespaces, content and snapshots, tested on containerd 2.3.4. Small drawings: a terminal with ctr tasks list showing two running tasks, the chain image to container to task, the namespaces default and k8s.io, and icons for images, containers, tasks, namespaces, snapshots and events.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #575757; }
      .acc { fill: #1d70b8; }
      .ink { fill: #343a40; }
      .pap { fill: #ffffff; stroke: #ced4da; stroke-width: 6; }
      .al  { stroke: #1d70b8; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wt  { fill: #ffffff; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .vf  { fill: #1d70b8; }
      .vs  { stroke: #1d70b8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .vl  { fill: #1d70b8; fill-opacity: .18; }
      .vp  { fill: #ffffff; }
      .vn  { fill: #868e96; }
      .vterm { fill: #212529; }
      .vtbar { fill: #343a40; }
      .vtx { fill: #e9ecef; }
      .vtb { fill: #74c0fc; }
      .ns  { fill: #1d70b8; fill-opacity: .10; stroke: #1d70b8; stroke-width: 4; stroke-dasharray: 14 10; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .ink { fill: #c9d1d9; }
        .pap { fill: #0d1117; stroke: #30363d; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .vp  { fill: #0d1117; }
        .vn  { fill: #8b949e; }
        .vterm { fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .vtbar { fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: ctr tasks list (real output from the test) -->
  <g transform="translate(100,200)">
    <rect class="vterm" x="0" y="0" width="860" height="330" rx="22"/>
    <rect class="vtbar" x="0" y="0" width="860" height="56" rx="22"/>
    <rect class="vtbar" x="0" y="34" width="860" height="22"/>
    <circle cx="40" cy="28" r="11" fill="#ff5f57"/><circle cx="80" cy="28" r="11" fill="#febc2e"/><circle cx="120" cy="28" r="11" fill="#28c840"/>
    <g font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="31">
      <text class="vtx" x="32" y="126"># ctr tasks list</text>
      <text class="vtx" x="32" y="180">TASK           PID     STATUS</text>
      <text class="vtb" x="32" y="230">web-server     1973    RUNNING</text>
      <text class="vtb" x="32" y="280">limited-web    2370    RUNNING</text>
    </g>
  </g>

  <!-- centre: image -> container -> task inside a namespace -->
  <rect class="ns" x="1040" y="190" width="1580" height="360" rx="30"/>
  <text class="n" x="1080" y="240" font-size="32" font-family="Menlo, Consolas, 'Liberation Mono', monospace">-n default · -n k8s.io</text>
  <rect class="pap" x="1090" y="290" width="380" height="190" rx="24"/>
  <text class="ink" x="1280" y="368" text-anchor="middle" font-size="44" font-weight="700">image</text>
  <text class="n" x="1280" y="425" text-anchor="middle" font-size="30">content + snapshots</text>
  <path class="al" d="M1490,385 H1600 M1570,359 L1600,385 L1570,411"/>
  <rect class="pap" x="1620" y="290" width="400" height="190" rx="24"/>
  <text class="ink" x="1820" y="368" text-anchor="middle" font-size="44" font-weight="700">container</text>
  <text class="n" x="1820" y="425" text-anchor="middle" font-size="30">metadata only</text>
  <path class="al" d="M2040,385 H2150 M2120,359 L2150,385 L2120,411"/>
  <rect class="acc" x="2170" y="280" width="400" height="210" rx="28"/>
  <text class="wt" x="2370" y="370" text-anchor="middle" font-size="48" font-weight="700">task</text>
  <text class="wt" x="2370" y="430" text-anchor="middle" font-size="30" font-weight="700" font-family="Menlo, Consolas, 'Liberation Mono', monospace">shim → runc</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="150">ctr Cheatsheet</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="84">The containerd CLI, every command tested</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="44">images · containers · tasks · namespaces · content · snapshots · k8s.io · containerd 2.3.4</text>

  <!-- icon row -->
  <!-- images: layers -->
  <g transform="translate(676,1290) scale(0.5)">
    <path class="vl" d="M100,30 L176,70 L100,110 L24,70 Z"/>
    <path class="vs" d="M100,30 L176,70 L100,110 L24,70 Z M24,104 L100,144 L176,104 M24,138 L100,178 L176,138" stroke-width="10"/>
  </g>
  <text class="vn" x="726" y="1450" text-anchor="middle" font-size="34">images</text>
  <!-- containers: box -->
  <g transform="translate(936,1290) scale(0.5)">
    <rect class="vl" x="30" y="50" width="140" height="110" rx="10"/>
    <rect class="vp" x="30" y="50" width="140" height="110" rx="10" fill="none" stroke="#1d70b8" stroke-width="10"/>
    <path class="vs" d="M58,50 V160 M86,50 V160 M114,50 V160 M142,50 V160" stroke-width="7"/>
  </g>
  <text class="vn" x="986" y="1450" text-anchor="middle" font-size="34">containers</text>
  <!-- tasks: play -->
  <g transform="translate(1196,1290) scale(0.5)">
    <circle class="vl" cx="100" cy="100" r="76"/>
    <circle class="vs" cx="100" cy="100" r="76" stroke-width="10"/>
    <path class="vf" d="M80,62 L142,100 L80,138 Z"/>
  </g>
  <text class="vn" x="1246" y="1450" text-anchor="middle" font-size="34">tasks</text>
  <!-- namespaces: nested boxes -->
  <g transform="translate(1456,1290) scale(0.5)">
    <rect class="vs" x="24" y="30" width="152" height="140" rx="12" stroke-width="10" stroke-dasharray="20 12"/>
    <rect class="vl" x="58" y="64" width="84" height="72" rx="8"/>
  </g>
  <text class="vn" x="1506" y="1450" text-anchor="middle" font-size="34">namespaces</text>
  <!-- snapshots: stacked sheets -->
  <g transform="translate(1716,1290) scale(0.5)">
    <rect class="vl" x="60" y="30" width="110" height="80" rx="8"/>
    <rect class="vp" x="44" y="60" width="110" height="80" rx="8" stroke="#1d70b8" stroke-width="9"/>
    <rect class="vp" x="28" y="90" width="110" height="80" rx="8" stroke="#1d70b8" stroke-width="9"/>
  </g>
  <text class="vn" x="1766" y="1450" text-anchor="middle" font-size="34">snapshots</text>
  <!-- events: pulse -->
  <g transform="translate(1976,1290) scale(0.5)">
    <path class="vs" d="M20,110 H62 L82,50 L112,160 L134,90 L148,110 H182" stroke-width="12"/>
  </g>
  <text class="vn" x="2026" y="1450" text-anchor="middle" font-size="34">events</text>
</svg>
