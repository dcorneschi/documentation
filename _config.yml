title: DevOps Wiki
description: >-
  Hands-on articles and cheatsheets on AWS, Kubernetes, Terraform, Docker,
  Ansible, Linux and terminal tools. Every command and output comes from a real run.
author: Daniel Corneschi
url: https://corneschi.ro
baseurl: ""
repository: dcorneschi/documentation
lang: en
tagline: hands-on DevOps notes

# Profile card in the right sidebar (_includes/profile.html), from github.com/dcorneschi.
profile:
  name: Daniel Corneschi
  username: dcorneschi
  avatar: https://avatars.githubusercontent.com/u/220212351?v=4&s=460
  bio: >-
    Linux systems engineer passionate about homelab infrastructure and container
    orchestration. Sharing practical guides and building resilient home environments.
  github: https://github.com/dcorneschi
  # From the About page of the blog. Optional per entry: url (e.g. a Credly badge).
  certifications:
    - {name: Red Hat Certified Engineer (RHCE), issuer: Red Hat}
    - {name: Cisco Certified Network Associate (CCNA), issuer: Cisco}
    - {name: "HashiCorp Certified: Terraform Associate", issuer: HashiCorp}
    - {name: AWS Certified Solutions Architect – Associate, issuer: Amazon Web Services}
    - {name: AWS Certified SysOps Administrator – Associate, issuer: Amazon Web Services}
    - {name: Datadog Fundamentals, issuer: Datadog}
    - {name: "IBM Certified System Administrator: AIX 6.1 Administration", issuer: IBM}
    - {name: "HP Accredited Technical Professional: HP-UX 11i v3 Administrator", issuer: Hewlett-Packard}
    - {name: ITIL Foundation Certificate in IT Service Management, issuer: PeopleCert}
  # Tech stack badges come from _data/stack.yml.

# Theme ("tty"): palettes the reader can switch between, first one is the default.
tty:
  prompt_user: dcorneschi
  palettes: [phosphor, amber, dracula, nord, gruvbox, tokyo-night, catppuccin, one-dark, rose-pine, paper, solarized, github-light, one-light, latte, gruvbox-light, rose-pine-dawn, graphite, slate, silver, claude, claude-dark]

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      disable: true   # inline `code` stays plain

plugins:
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-seo-tag
  - jekyll-sitemap

titles_from_headings:
  strip_title: true   # the layout prints the title itself

relative_links:
  enabled: true
  collections: false

defaults:
  - scope: { path: "", type: pages }
    values:
      layout: article
      # Articles show Helm/Ansible/Go templates ({{ }}, {% %}) as code: never run them as Liquid.
      render_with_liquid: false
  - scope: { path: README.md }
    values:
      layout: home
      title: DevOps Wiki
  # Generated by jekyll-sitemap: these are Liquid templates and must be rendered.
  - scope: { path: sitemap.xml }
    values: { render_with_liquid: true }
  - scope: { path: robots.txt }
    values: { render_with_liquid: true }

exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .venv
  - .bundle
  - .jekyll-cache
  - scripts
  - _build

optional_front_matter:
  remove_originals: true   # do not also publish the raw .md files

readme_index:
  remove_originals: true

# Pagefind writes the search index into _site/pagefind after the build; keep it across `jekyll serve` rebuilds.
keep_files: [pagefind]
