<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-palette="{{ site.tty.palettes | first }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* Apply the saved palette before first paint (no flash). */
    (function () {
      var p = null;
      try { p = localStorage.getItem("tty-palette"); } catch (e) {}
      if (!p && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) p = "paper";
      if (p) document.documentElement.setAttribute("data-palette", p);
    })();
  </script>
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,800;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/tty.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body class="layout-{{ page.layout }}">
  <a class="skip" href="#main">skip to content</a>
  {% include topbar.html %}
  {{ content }}
  <footer class="footer">
    <span>&copy; {{ site.time | date: "%Y" }} {{ site.author }}</span>
    <span class="dim">built with jekyll · theme <b>tty</b></span>
    <a href="https://github.com/{{ site.repository }}">source</a>
  </footer>
  {% include search.html %}
  <script>window.TTY = { baseurl: {{ site.baseurl | jsonify }}, palettes: {{ site.tty.palettes | jsonify }} };</script>
  <script src="{{ '/assets/js/tty.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
