  <text class="h" x="20" y="28">When the kubelet restarted a container that exits at once</text>
  <text class="sub" x="20" y="48">Each dot is a start; 22 minutes, Kubernetes 1.37, one worker per setting</text>
  <text class="tb" x="20" y="74">Default</text><text class="d" x="520" y="74">9 restarts in 22 min, cap 300 s</text>
