<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Why tee Output Goes Missing in cloud-init</title>
  <desc id="d">Why tee Output Goes Missing in cloud-init: Your tee, cloud-init's tee, and what breaks the path. tee, runcmd, output directive, cloud-init-output.log, 2>&amp;1, logger, stdbuf, /bin/sh (dash), Ubuntu 24.04. Small drawings: a terminal piping echo hello through tee, a command flowing through your tee into a file and on through cloud-init's tee into cloud-init-output.log, and icons for tee, pipe, 2>&amp;1, logger, buffering and the output log.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #40c057; }
      .ink { fill: #343a40; }
      .pap { fill: #ffffff; stroke: #ced4da; stroke-width: 6; }
      .ln  { stroke: #adb5bd; stroke-width: 10; stroke-linecap: round; fill: none; }
      .al  { stroke: #40c057; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wt  { fill: #ffffff; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .vf  { fill: #40c057; }
      .vs  { stroke: #40c057; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .vl  { fill: #40c057; fill-opacity: .18; }
      .vp  { fill: #ffffff; }
      .vn  { fill: #868e96; }
      .vterm { fill: #212529; }
      .vtbar { fill: #343a40; }
      .vtx { fill: #e9ecef; }
      .vtg { fill: #8ce99a; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .ink { fill: #c9d1d9; }
        .pap { fill: #0d1117; stroke: #30363d; }
        .ln  { stroke: #484f58; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .vp  { fill: #0d1117; }
        .vn  { fill: #8b949e; }
        .vterm { fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .vtbar { fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: terminal -->
  <g transform="translate(130,170)">
    <rect class="vterm" x="0" y="0" width="800" height="400" rx="22"/>
    <rect class="vtbar" x="0" y="0" width="800" height="56" rx="22"/>
    <rect class="vtbar" x="0" y="34" width="800" height="22"/>
    <circle cx="40" cy="28" r="11" fill="#ff5f57"/><circle cx="80" cy="28" r="11" fill="#febc2e"/><circle cx="120" cy="28" r="11" fill="#28c840"/>
    <g font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="32">
      <text class="vtx" x="32" y="130">$ echo "hello" | tee /tmp/hello.txt</text>
      <text class="vtg" x="36" y="182">hello</text>
      <text class="vtx" x="36" y="262">$ cat /tmp/hello.txt</text>
      <text class="vtg" x="36" y="314">hello</text>
    </g>
  </g>

  <!-- top centre/right: cmd -> your tee -> file, -> cloud-init's tee -> output log -->
  <rect class="pap" x="1010" y="270" width="250" height="140" rx="24"/>
  <text class="ink" x="1135" y="355" text-anchor="middle" font-size="46" font-weight="700" font-family="Menlo, Consolas, 'Liberation Mono', monospace">cmd</text>
  <path class="al" d="M1280,340 H1380 M1350,314 L1380,340 L1350,366"/>
  <rect class="a" x="1400" y="270" width="300" height="140" rx="24"/>
  <text class="wt" x="1550" y="333" text-anchor="middle" font-size="42" font-weight="700" font-family="Menlo, Consolas, 'Liberation Mono', monospace">your tee</text>
  <text class="wt" x="1550" y="380" text-anchor="middle" font-size="30" font-family="Menlo, Consolas, 'Liberation Mono', monospace">tee -a setup.log</text>
  <path class="al" d="M1550,430 V500 M1524,470 L1550,500 L1576,470"/>
  <rect class="pap" x="1440" y="515" width="220" height="80" rx="18"/>
  <text class="n" x="1550" y="568" text-anchor="middle" font-size="34" font-family="Menlo, Consolas, 'Liberation Mono', monospace">setup.log</text>
  <path class="al" d="M1720,340 H1820 M1790,314 L1820,340 L1790,366"/>
  <rect class="pap" x="1840" y="270" width="380" height="140" rx="24" stroke="#212529" stroke-width="4"/>
  <text class="ink" x="2030" y="333" text-anchor="middle" font-size="40" font-weight="700" font-family="Menlo, Consolas, 'Liberation Mono', monospace">cloud-init tee</text>
  <text class="n" x="2030" y="380" text-anchor="middle" font-size="30" font-family="Menlo, Consolas, 'Liberation Mono', monospace">output: all</text>
  <path class="al" d="M2030,430 V500 M2004,470 L2030,500 L2056,470"/>
  <rect class="pap" x="1825" y="515" width="410" height="80" rx="18"/>
  <text class="n" x="2030" y="568" text-anchor="middle" font-size="30" font-family="Menlo, Consolas, 'Liberation Mono', monospace">cloud-init-output.log</text>
  <path class="al" d="M2240,340 H2360 M2330,314 L2360,340 L2330,366"/>
  <rect class="pap" x="2380" y="285" width="220" height="110" rx="20"/>
  <text class="n" x="2490" y="352" text-anchor="middle" font-size="34">console</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="124">Why tee Output Goes Missing in cloud-init</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="84">Your tee, cloud-init's tee, and what breaks the path</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="47">tee · runcmd · output: · cloud-init-output.log · 2&gt;&amp;1 · logger · stdbuf · /bin/sh (dash) · Ubuntu 24.04</text>

  <!-- icon row -->
  <g transform="translate(676,1290) scale(0.5)">
    <path class="vs" d="M20,100 H100 M100,100 L176,40 M100,100 L176,160 M150,30 L180,40 L168,70 M150,170 L180,160 L168,130" stroke-width="18"/>
  </g>
  <text class="vn" x="726" y="1450" text-anchor="middle" font-size="34">tee</text>
  <g transform="translate(936,1290) scale(0.5)">
    <rect class="vl" x="20" y="20" width="160" height="160" rx="24"/>
    <path class="vs" d="M100,40 V160" stroke-width="22"/>
  </g>
  <text class="vn" x="986" y="1450" text-anchor="middle" font-size="34">pipe</text>
  <g transform="translate(1196,1290) scale(0.5)">
    <path class="vs" d="M30,60 H130 M100,30 L130,60 L100,90" stroke-width="16"/>
    <path class="vs" d="M30,140 H130 M100,110 L130,140 L100,170" stroke-width="16" opacity=".55"/>
    <path class="vs" d="M150,60 V140" stroke-width="16"/>
  </g>
  <text class="vn" x="1246" y="1450" text-anchor="middle" font-size="34">2&gt;&amp;1</text>
  <g transform="translate(1456,1290) scale(0.5)">
    <rect class="vp" x="30" y="20" width="140" height="160" rx="14" stroke="#40c057" stroke-width="9"/>
    <path class="vs" d="M56,64 H144 M56,100 H144 M56,136 H120" stroke-width="12"/>
    <circle class="vf" cx="160" cy="160" r="30"/>
  </g>
  <text class="vn" x="1506" y="1450" text-anchor="middle" font-size="34">logger</text>
  <g transform="translate(1716,1290) scale(0.5)">
    <path class="vp" d="M50,20 H150 V40 L108,100 L150,160 V180 H50 V160 L92,100 L50,40 Z" stroke="#40c057" stroke-width="10" stroke-linejoin="round"/>
    <path class="vf" d="M70,160 L100,128 L130,160 Z"/>
  </g>
  <text class="vn" x="1766" y="1450" text-anchor="middle" font-size="34">buffering</text>
  <g transform="translate(1976,1290) scale(0.5)">
    <rect class="vp" x="30" y="16" width="140" height="170" rx="14" stroke="#40c057" stroke-width="9"/>
    <path class="vs" d="M56,60 H144 M56,96 H144 M56,132 H120" stroke-width="12"/>
  </g>
  <text class="vn" x="2026" y="1450" text-anchor="middle" font-size="34">output log</text>
</svg>
