<div class="search" id="search" role="dialog" aria-modal="true" aria-label="Search the wiki" hidden>
  <div class="search-window">
    <div class="win-bar">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="win-title">search — {{ site.data.article_count }} articles indexed</span>
      <button class="icon-btn search-close" type="button" aria-label="Close search">esc</button>
    </div>
    <label class="search-prompt">
      <span class="prompt-sign">$ grep -ri "</span>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="kubectl rollout" aria-label="Search query">
      <span class="prompt-sign">"</span>
    </label>
    <ol class="search-results" id="search-results" aria-live="polite"></ol>
    <div class="search-help dim"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>enter</kbd> open · <kbd>esc</kbd> close</div>
  </div>
</div>
