<aside class="sidebar" id="sidebar" aria-label="Articles">
  <div class="sidebar-inner">
    <label class="filter">
      <span class="prompt-sign">ls |</span>
      <input id="nav-filter" type="search" placeholder="filter" autocomplete="off" spellcheck="false" aria-label="Filter articles">
    </label>
    {% for cat in site.data.nav %}
    <details class="nav-cat" data-cat="{{ cat.id }}"{% if cat.id == page.category_id %} open{% endif %}>
      <summary><span class="dir">{{ cat.id }}/</span><span class="count">{{ cat.pages | size }}</span></summary>
      <ul>
        {% for p in cat.pages %}
        <li><a href="{{ p.url | relative_url }}"{% if p.url == page.url %} aria-current="page"{% endif %}>{{ p.title }}</a></li>
        {% endfor %}
      </ul>
    </details>
    {% endfor %}
  </div>
</aside>
