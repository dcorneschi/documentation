name: Build and deploy the wiki (Jekyll)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  JEKYLL_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: articles not in _data/published.yml are dated by the commit that added them

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # Fails on a README entry without an article, or an article missing from the README
      # (_plugins/readme_nav.rb).
      - run: bundle exec jekyll build --strict_front_matter

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Search index (Pagefind)
        run: |
          pip install 'pagefind[bin]==1.6.0'
          python -m pagefind --site _site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
