<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Getting Started with Argo CD: Deploy Metrics Server from a Helm Chart</title>
  <desc id="d">Getting Started with Argo CD: Deploy Metrics Server from a Helm Chart. Install with Helm, one Application, automated sync, self-heal and prune, Argo CD v3.6.3. Small drawings: a terminal with kubectl get application showing metrics-server Synced Healthy, a Helm chart going through Argo CD into the cluster, sync and health badges, and icons for Helm, the Application, sync, self-heal, prune and kubectl top.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #e96d3f; }
      .ink { fill: #343a40; }
      .pap { fill: #ffffff; stroke: #ced4da; stroke-width: 6; }
      .al  { stroke: #e96d3f; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wt  { fill: #ffffff; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .vf  { fill: #e96d3f; }
      .vs  { stroke: #e96d3f; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .vl  { fill: #e96d3f; fill-opacity: .18; }
      .vp  { fill: #ffffff; }
      .vn  { fill: #868e96; }
      .vterm { fill: #212529; }
      .vtbar { fill: #343a40; }
      .vtx { fill: #e9ecef; }
      .vtb { fill: #74c0fc; }
      .ok  { fill: #2b8a3e; }
      .okb { fill: #2b8a3e; fill-opacity: .14; stroke: #2b8a3e; stroke-width: 4; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .ink { fill: #c9d1d9; }
        .pap { fill: #0d1117; stroke: #30363d; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .vp  { fill: #0d1117; }
        .vn  { fill: #8b949e; }
        .vterm { fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .vtbar { fill: #21262d; }
        .ok  { fill: #3fb950; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: kubectl get application (real output from the test) -->
  <g transform="translate(100,200)">
    <rect class="vterm" x="0" y="0" width="980" height="290" rx="22"/>
    <rect class="vtbar" x="0" y="0" width="980" height="56" rx="22"/>
    <rect class="vtbar" x="0" y="34" width="980" height="22"/>
    <circle cx="40" cy="28" r="11" fill="#ff5f57"/><circle cx="80" cy="28" r="11" fill="#febc2e"/><circle cx="120" cy="28" r="11" fill="#28c840"/>
    <g font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="27">
      <text class="vtx" x="32" y="126">$ kubectl get application metrics-server -n argo</text>
      <text class="vtx" x="32" y="186">NAME             SYNC STATUS   HEALTH STATUS</text>
      <text class="vtb" x="32" y="236">metrics-server   Synced        Healthy</text>
    </g>
  </g>

  <!-- centre: chart -> Argo CD -> cluster -->
  <rect class="pap" x="1140" y="250" width="250" height="180" rx="24"/>
  <text class="ink" x="1265" y="325" text-anchor="middle" font-size="40" font-weight="700">Helm</text>
  <text class="n" x="1265" y="380" text-anchor="middle" font-size="30">chart</text>
  <path class="al" d="M1410,340 H1510 M1480,314 L1510,340 L1480,366"/>
  <rect class="a" x="1530" y="230" width="300" height="220" rx="28"/>
  <text class="wt" x="1680" y="330" text-anchor="middle" font-size="48" font-weight="700">Argo CD</text>
  <text class="wt" x="1680" y="390" text-anchor="middle" font-size="30" font-weight="700" font-family="Menlo, Consolas, 'Liberation Mono', monospace">Application</text>
  <path class="al" d="M1850,340 H1950 M1920,314 L1950,340 L1920,366"/>
  <rect class="pap" x="1970" y="250" width="290" height="180" rx="24"/>
  <text class="ink" x="2115" y="325" text-anchor="middle" font-size="38" font-weight="700">cluster</text>
  <text class="n" x="2115" y="380" text-anchor="middle" font-size="28" font-family="Menlo, Consolas, 'Liberation Mono', monospace">kube-system</text>

  <!-- badges -->
  <rect class="okb" x="2300" y="250" width="330" height="80" rx="40"/>
  <text class="ok" x="2465" y="303" text-anchor="middle" font-size="38" font-weight="700">Synced</text>
  <rect class="okb" x="2300" y="350" width="330" height="80" rx="40"/>
  <text class="ok" x="2465" y="403" text-anchor="middle" font-size="38" font-weight="700">Healthy</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="140">Getting Started with Argo CD</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="84">Deploy Metrics Server from a Helm chart</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="44">Helm install · Application · automated sync · selfHeal · prune · targetRevision · Argo CD v3.6.3</text>

  <!-- icon row -->
  <!-- chart: package -->
  <g transform="translate(676,1290) scale(0.5)">
    <path class="vl" d="M100,24 L170,62 V140 L100,178 L30,140 V62 Z"/>
    <path class="vs" d="M100,24 L170,62 V140 L100,178 L30,140 V62 Z M30,62 L100,100 L170,62 M100,100 V178" stroke-width="10"/>
  </g>
  <text class="vn" x="726" y="1450" text-anchor="middle" font-size="34">chart</text>
  <!-- application: doc with check -->
  <g transform="translate(936,1290) scale(0.5)">
    <path class="vp" d="M50,20 H128 L160,52 V180 H50 Z" stroke="#e96d3f" stroke-width="10"/>
    <path class="vs" d="M74,112 L96,134 L136,90" stroke-width="12"/>
  </g>
  <text class="vn" x="986" y="1450" text-anchor="middle" font-size="34">Application</text>
  <!-- sync: two arrows circle -->
  <g transform="translate(1196,1290) scale(0.5)">
    <path class="vs" d="M40,100 A60,60 0 0 1 150,66 M160,100 A60,60 0 0 1 50,134" stroke-width="14"/>
    <path class="vf" d="M136,40 L170,72 L126,82 Z"/>
    <path class="vf" d="M64,160 L30,128 L74,118 Z"/>
  </g>
  <text class="vn" x="1246" y="1450" text-anchor="middle" font-size="34">sync</text>
  <!-- self-heal: shield with plus -->
  <g transform="translate(1456,1290) scale(0.5)">
    <path class="vp" d="M100,16 L172,44 V102 C172,146 140,174 100,186 C60,174 28,146 28,102 V44 Z" stroke="#e96d3f" stroke-width="10"/>
    <path d="M100,70 V130 M70,100 H130" stroke="#e96d3f" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>
  <text class="vn" x="1506" y="1450" text-anchor="middle" font-size="34">self-heal</text>
  <!-- prune: scissors-like cut -->
  <g transform="translate(1716,1290) scale(0.5)">
    <rect class="vl" x="30" y="60" width="140" height="100" rx="12"/>
    <path class="vs" d="M30,60 L170,160 M170,60 L30,160" stroke-width="14"/>
  </g>
  <text class="vn" x="1766" y="1450" text-anchor="middle" font-size="34">prune</text>
  <!-- metrics: bars -->
  <g transform="translate(1976,1290) scale(0.5)">
    <path class="vs" d="M24,170 H180" stroke-width="10"/>
    <rect class="vl" x="36" y="96" width="30" height="70" rx="4"/>
    <rect class="vf" x="86" y="46" width="30" height="120" rx="4"/>
    <rect class="vl" x="136" y="76" width="30" height="90" rx="4"/>
  </g>
  <text class="vn" x="2026" y="1450" text-anchor="middle" font-size="34">kubectl top</text>
</svg>
